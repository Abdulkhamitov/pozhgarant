<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет · ПожГарант</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; background: #f4f5f7; color: #1a1a1a; }
    header { background: #14171c; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    header .logo { font-weight: 800; font-size: 20px; }
    header .logo span { color: #e63946; }
    .user-info { display: flex; gap: 16px; align-items: center; font-size: 14px; }
    .logout { background: #e63946; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .logout:hover { background: #b71c1c; }
    .container { max-width: 900px; margin: 40px auto; padding: 0 24px; }
    h1 { color: #14171c; font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: #6b7280; margin-bottom: 32px; }
    .order { background: #fff; border-radius: 16px; padding: 22px 24px; margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.05); display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; border-left: 4px solid #e5e7eb; }
    .order.new { border-left-color: #3b82f6; }
    .order.in_progress { border-left-color: #f59e0b; }
    .order.done { border-left-color: #22c55e; }
    .order-title { font-weight: 700; font-size: 17px; margin-bottom: 6px; }
    .order-desc { color: #555; font-size: 14px; white-space: pre-line; }
    .order-date { color: #999; font-size: 12px; margin-top: 10px; }
    .status { padding: 6px 14px; border-radius: 100px; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .status-new { background: #dbeafe; color: #1e40af; }
    .status-in_progress { background: #fef3c7; color: #92400e; }
    .status-done { background: #d1fae5; color: #065f46; }
    .empty { text-align: center; color: #888; padding: 80px 20px; background: #fff; border-radius: 16px; }
    .empty a { color: #e63946; text-decoration: none; font-weight: 600; }
    .new-order-btn { display: inline-block; background: #e63946; color: #fff; padding: 12px 24px; border-radius: 10px; text-decoration: none; font-weight: 700; margin-bottom: 24px; }
    .new-order-btn:hover { background: #b71c1c; }
  </style>
</head>
<body>
  <header>
    <div class="logo">Пож<span>Гарант</span> · Кабинет</div>
    <div class="user-info">
      <span id="userName"></span>
      <button class="logout" id="logoutBtn">Выйти</button>
    </div>
  </header>

  <div class="container">
    <h1>Мои заявки</h1>
    <p class="subtitle">Здесь отображаются все ваши обращения и их статусы</p>
    <a href="index.html#order" class="new-order-btn">+ Новая заявка</a>
    <div id="orders"></div>
  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const statusLabels = { new: 'Новая', in_progress: 'В работе', done: 'Выполнена' };

    document.getElementById('logoutBtn').addEventListener('click', () => {
      signOut(auth).then(() => window.location.href = 'index.html');
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }

      // Имя пользователя
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      document.getElementById('userName').textContent = userDoc.exists() ? (userDoc.data().name || user.email) : user.email;

      // Заявки пользователя
      const q = query(collection(db, 'orders'), where('userId', '==', user.uid));
      const snap = await getDocs(q);
      const container = document.getElementById('orders');

      // Сортировка на клиенте (не требует индекса)
      const orders = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

      if (orders.length === 0) {
        container.innerHTML = '<div class="empty">У вас пока нет заявок.<br><br><a href="index.html#order">Оставить первую заявку →</a></div>';
        return;
      }

      container.innerHTML = orders.map(o => {
        const date = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleString('ru-RU') : '';
        return `
          <div class="order ${o.status}">
            <div>
              <div class="order-title">${o.serviceType || 'Заявка'}</div>
              <div class="order-desc">${o.message || 'Без описания'}</div>
              <div class="order-date">${date}</div>
            </div>
            <div class="status status-${o.status}">${statusLabels[o.status] || o.status}</div>
          </div>
        `;
      }).join('');
    });
  </script>
</body>
</html>
