<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сброс пароля · ПожГарант</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      background: #14171c; color: #fff;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .box {
      background: #1f242c; padding: 44px; border-radius: 22px;
      width: 100%; max-width: 420px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .logo { font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 8px; }
    .logo span { color: #e63946; }
    h1 { font-size: 21px; text-align: center; margin-bottom: 12px; color: #fff; font-weight: 600; }
    .hint {
      text-align: center; color: #888; font-size: 14px;
      margin-bottom: 26px; line-height: 1.5;
    }
    input {
      width: 100%; padding: 14px 16px; margin-bottom: 14px;
      border-radius: 10px; border: 1.5px solid #2a2f38;
      background: #14171c; color: #fff; font-size: 15px;
      font-family: inherit; transition: 0.2s;
    }
    input:focus { outline: none; border-color: #e63946; }
    button {
      width: 100%; padding: 15px; background: #e63946; color: #fff;
      border: none; border-radius: 10px; font-size: 16px;
      font-weight: 700; cursor: pointer; transition: 0.2s;
    }
    button:hover { background: #b71c1c; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .message {
      font-size: 14px; text-align: center; margin-bottom: 14px;
      min-height: 20px; line-height: 1.5;
    }
    .message.error { color: #ff6b6b; }
    .message.success { color: #22c55e; }
    .back {
      text-align: center; margin-top: 20px; font-size: 14px;
    }
    .back a { color: #888; text-decoration: none; transition: 0.2s; }
    .back a:hover { color: #e63946; }
    .success-box {
      text-align: center; padding: 20px 0;
    }
    .success-box .check {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(34,197,94,0.15); margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
      color: #22c55e;
    }
    .success-box h2 { font-size: 19px; margin-bottom: 12px; }
    .success-box p { color: #888; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="box" id="box">
    <div class="logo">Пож<span>Гарант</span></div>
    <h1>Сброс пароля</h1>
    <p class="hint">Введите email, указанный при регистрации.<br>Мы отправим ссылку для сброса пароля.</p>

    <div class="message" id="message"></div>

    <form id="resetForm">
      <input type="email" id="email" placeholder="Ваш email" autocomplete="email" required>
      <button type="submit" id="submitBtn">Отправить ссылку</button>
    </form>

    <div class="back">
      <a href="login.html">← Вернуться к входу</a>
    </div>
  </div>

  <script type="module">
    import { auth } from './firebase-config.js';
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');
    const box = document.getElementById('box');

    function showMessage(text, type = 'error') {
      messageEl.className = 'message ' + type;
      messageEl.textContent = text;
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();

      if (!email) {
        showMessage('Введите email');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Отправка...';
      showMessage('');

      try {
        await sendPasswordResetEmail(auth, email);

        // Заменяем содержимое на успешный экран
        box.innerHTML = `
          <div class="logo">Пож<span>Гарант</span></div>
          <div class="success-box">
            <div class="check">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6L9 17l-5-5"/>
              </svg>
            </div>
            <h2>Письмо отправлено</h2>
            <p>Мы отправили ссылку для сброса пароля на <strong>${email}</strong>.<br><br>
            Проверьте папку «Входящие» и «Спам». Ссылка действует 1 час.</p>
            <a href="login.html" style="color:#e63946;text-decoration:none;font-weight:600;">← Вернуться к входу</a>
          </div>
        `;
      } catch (err) {
        console.error(err);
        const messages = {
          'auth/user-not-found': 'Пользователь с таким email не найден',
          'auth/invalid-email': 'Некорректный email',
          'auth/too-many-requests': 'Слишком много попыток. Подождите 10 минут',
          'auth/network-request-failed': 'Ошибка сети. Проверьте интернет',
          'auth/unauthorized-domain': 'Домен не добавлен в Firebase (Authorized domains)'
        };
        showMessage(messages[err.code] || 'Ошибка: ' + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Отправить ссылку';
      }
    });
  </script>
</body>
</html>
